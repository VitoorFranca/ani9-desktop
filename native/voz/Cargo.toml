[package]
name = "ani9-voz"
version = "0.1.0"
edition = "2021"
description = "Motor de voz do app ANI-9 para macOS: entende a fala e responde falando, com modelos locais."
license = "MIT"
publish = false

[dependencies]
sherpa-onnx = "=1.13.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
